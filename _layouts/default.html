<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "Shay Tanne" }}</title>
  <meta name="description" content="{{ page.description | default: site.description | default: 'Portfolio and CV of Shay Tanne — ML Engineer.' }}">
  <meta name="author" content="Shay Tanne">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('portfolio-theme');
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="wrapper">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-name">Portfolio</div>
        </div>
        
        <nav>
          <ul class="nav-list">
              <li><a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a></li>
              <li><a href="{{ '/research/' | relative_url }}" class="{% if page.url == '/research/' %}active{% endif %}">Research</a></li>
              <li><a href="{{ '/cv/' | relative_url }}" class="{% if page.url == '/cv/' %}active{% endif %}">CV</a></li>
          </ul>
        </nav>
        <div class="sidebar-socials">
          <a href="https://github.com/shaytanne" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
          <a href="https://linkedin.com/in/shay-tanne" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="mailto:shaytanne1@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
        </div>
    </aside>

    <main class="main-content">
      {{ content }}
    </main>

  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>

</body>
</html>
